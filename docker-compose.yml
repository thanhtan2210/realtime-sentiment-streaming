# Kafka (KRaft, one node) -> Spark Structured Streaming -> MongoDB.
#
#   docker compose up -d                              # kafka, mongodb, processor, dashboard
#   docker compose run --rm producer --speedup 600    # replay the test tweets
#   http://localhost:8501                             # the dashboard, live from MongoDB
#   docker compose down -v                            # stop and delete all data
#
# Memory limits add up to about 4 GB (plus 256 MB while the producer runs).
#
# Live mode (English Bluesky posts, profile `live`), on its own topic,
# collections, checkpoints and cursor; `make live-up` starts only what it needs:
#   docker compose --profile live up -d --build kafka mongodb ingest-live processor-live
#   docker compose --profile live down -v
# Memory limits for that set: about 3.6 GB.
name: realtime-sentiment

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      # PLAINTEXT is for the other containers, EXTERNAL for debugging from the host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by kafka-init, never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      # Both loopback addresses: on Windows `localhost` resolves to ::1 first.
      - "127.0.0.1:29092:29092"
      - "[::1]:29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # A port check, not a Kafka CLI call: the CLI starts a second JVM
      # inside this container's memory limit.
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    mem_limit: 768m

  # One-shot: create the input topic, then exit.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic tweets --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic tweets
    restart: "no"
    mem_limit: 256m

  mongodb:
    image: mongo:7
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27017:27017"
      - "[::1]:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    mem_limit: 512m

  processor:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: realtime-sentiment-spark
    command: ["python", "-m", "src.stream.processor"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URI: mongodb://mongodb:27017
      SPARK_MASTER: local[2]
      SPARK_DRIVER_MEMORY: 1g
    volumes:
      - checkpoints:/app/checkpoints
    mem_limit: 2048m

  dashboard:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: realtime-sentiment-app
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SENTIMENT_SOURCE: mongo
      MONGODB_URI: mongodb://mongodb:27017
    ports:
      - "127.0.0.1:8501:8501"
      - "[::1]:8501:8501"
    mem_limit: 512m

  # Not started by `docker compose up`. Run it with
  #   docker compose run --rm producer [--speedup N | --max-rate] [--limit K] [--run-id ID]
  producer:
    profiles: ["replay"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: realtime-sentiment-app
    entrypoint: ["python", "-m", "src.stream.producer"]
    command: ["--speedup", "600"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    mem_limit: 256m

  # --- live mode ---------------------------------------------------------------

  # One-shot: create the live topic, then exit.
  kafka-init-live:
    profiles: ["live"]
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic posts_live --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic posts_live
    restart: "no"
    mem_limit: 256m

  # Reads the Bluesky Jetstream and sends English posts to posts_live. The
  # cursor (time of the last post Kafka acknowledged) lives in live-state, so a
  # restart resumes where it stopped. `docker compose stop` lets it flush first.
  ingest-live:
    profiles: ["live"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: realtime-sentiment-app
    entrypoint: ["python", "-m", "src.stream.producer"]
    command: ["--source", "bluesky"]
    depends_on:
      kafka-init-live:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LIVE_CURSOR_PATH: /app/state/bluesky_cursor.json
    volumes:
      - live-state:/app/state
    restart: on-failure
    stop_grace_period: 30s
    mem_limit: 256m

  processor-live:
    profiles: ["live"]
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: realtime-sentiment-spark
    command: ["python", "-m", "src.stream.processor"]
    depends_on:
      kafka-init-live:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      PIPELINE_MODE: live
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URI: mongodb://mongodb:27017
      SPARK_MASTER: local[2]
      SPARK_DRIVER_MEMORY: 1g
    volumes:
      - live-checkpoints:/app/checkpoints/live
    mem_limit: 2048m

volumes:
  kafka_data:
  mongo_data:
  checkpoints:
  live-state:
  live-checkpoints:
