name: Benchmark

# Measures the stack on the GitHub runner and uploads reports/benchmark.json
# and the service logs as an artifact. Nothing is committed or pushed.
#
# Run it by hand (workflow_dispatch), or push a branch named benchmark/<anything>
# to measure that branch without merging it into main.
on:
  workflow_dispatch:
  push:
    branches:
      - "benchmark/**"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Publish the host ports on 127.0.0.1 only: a runner with IPv6 disabled
      # cannot bind the [::1] ports of docker-compose.yml.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # scripts.benchmark_stream runs on the runner itself; it needs pymongo, numpy and pandas.
      - name: Install the benchmark's Python dependencies
        run: pip install -r requirements.txt

      - name: Build images
        run: docker compose --profile replay build

      # Not the dashboard: nothing should run next to the measured services.
      - name: Start the stack
        run: docker compose up -d kafka mongodb processor

      - name: Wait for the processor's queries
        run: |
          for attempt in $(seq 1 60); do
            if docker compose logs --no-log-prefix processor | grep -q "Query started: airline_windows"; then
              exit 0
            fi
            if [ "$(docker compose ps -a --format '{{.State}}' processor)" != "running" ]; then
              echo "The processor is not running"
              exit 1
            fi
            sleep 5
          done
          echo "The processor did not start its queries within 5 minutes"
          exit 1

      - name: Streaming benchmark
        run: python -m scripts.benchmark_stream
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017

      # Stop the streaming job so it does not compete with the micro-benchmark.
      - name: Stop the processor
        run: docker compose stop processor

      - name: udf vs pandas_udf micro-benchmark
        run: >
          docker compose run --rm --no-deps
          -e GITHUB_ACTIONS -e GITHUB_SHA -e ImageOS
          -v ./scripts:/app/scripts:ro
          -v ./data/raw:/app/data/raw:ro
          -v ./reports:/app/reports
          processor python -m scripts.benchmark_udf

      - name: Show the report
        run: cat reports/benchmark.json

      - name: Collect service logs
        if: always()
        run: |
          mkdir -p reports
          docker compose ps -a > reports/compose-ps.txt
          docker compose logs --no-color > reports/compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            reports/benchmark.json
            reports/compose-ps.txt
            reports/compose-logs.txt

      - name: Tear down
        if: always()
        run: docker compose --profile replay down -v
