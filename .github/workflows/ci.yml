name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Spark 3.5 supports Python up to 3.11.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Tests marked `spark` start a local Spark session and need a JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
