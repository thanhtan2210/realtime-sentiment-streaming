# One live-mode run on a GitHub-hosted runner: English Bluesky posts for 45
# minutes (5 of warm-up, 40 measured), then the run report and a random sample
# of posts for manual labeling. Results are uploaded as artifacts only: this
# workflow does not commit or push anything.
#
# The repository is public, so anyone signed in to GitHub can download its
# artifacts. The labeling sample holds other people's post text, so it is
# uploaded only encrypted with the repository secret LABEL_SAMPLE_PASSPHRASE
# (openssl enc -aes-256-cbc -pbkdf2 -iter 600000); the run stops at once if the
# secret is missing. Decrypt it with:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in label_sample.csv.enc -out label_sample.csv
#
# Start it by pushing a branch named live/<anything>, or from the Actions tab.
name: Live run

on:
  push:
    branches: ["live/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-run
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # The runner cannot bind the [::1] ports of docker-compose.yml.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      RUN_MINUTES: 45
    steps:
      - name: Check the labeling passphrase
        env:
          LABEL_SAMPLE_PASSPHRASE: ${{ secrets.LABEL_SAMPLE_PASSPHRASE }}
        run: |
          if [ -z "$LABEL_SAMPLE_PASSPHRASE" ]; then
            echo "The repository secret LABEL_SAMPLE_PASSPHRASE is not set: the labeling sample cannot be encrypted"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # The report and the sample read MongoDB from the runner.
      - run: pip install -r requirements.txt

      - name: Build images
        run: docker compose --profile live build ingest-live processor-live

      - name: Start live mode
        run: docker compose --profile live up -d kafka mongodb ingest-live processor-live

      - name: Wait for the processor's queries
        run: |
          for _ in $(seq 60); do
            if docker compose --profile live logs --no-log-prefix processor-live | grep -q "Query started: live_windows"; then
              exit 0
            fi
            if [ "$(docker compose --profile live ps -a --format '{{.State}}' processor-live)" != "running" ]; then
              echo "The processor is not running"
              exit 1
            fi
            sleep 5
          done
          echo "The processor did not start its queries within 5 minutes"
          exit 1

      - name: Run for ${{ env.RUN_MINUTES }} minutes
        run: |
          end=$(( $(date +%s) + RUN_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 60
            for service in ingest-live processor-live; do
              if [ "$(docker compose --profile live ps -a --format '{{.State}}' "$service")" != "running" ]; then
                echo "$service stopped early"
                exit 1
              fi
            done
            # the producer's per-minute line: counts, lag and topics, no post text
            docker compose --profile live logs --no-log-prefix --since 65s ingest-live | grep -E "LIVE |Switching|lost or refused" || true
          done

      # `docker compose stop` sends SIGTERM: the producer flushes, saves its
      # cursor and logs LIVE_SUMMARY.
      - name: Stop the producer
        run: |
          docker compose --profile live stop ingest-live
          docker compose --profile live logs --no-log-prefix ingest-live | grep "LIVE_SUMMARY"

      - name: Wait until the processor has written everything
        id: written
        run: |
          # posts in live_predictions, and posts counted in the `all` rows of live_windows
          totals() {
            docker compose --profile live exec -T mongodb mongosh --quiet --eval '
              const db_ = db.getSiblingDB("sentiment");
              const all = db_.live_windows.aggregate([{$match: {topic: "all"}}, {$group: {_id: null, n: {$sum: "$total"}}}]).toArray();
              print(db_.live_predictions.countDocuments() + " " + (all.length ? all[0].n : 0));'
          }
          last=""
          for _ in $(seq 30); do
            now=$(totals)
            echo "live_predictions, live_windows(all): $now"
            if [ "$now" = "$last" ]; then
              exit 0
            fi
            last=$now
            sleep 20
          done
          echo "MongoDB was still growing after 10 minutes"
          exit 1

      - name: Run report
        run: |
          status=0
          python -m scripts.live_report --warmup-minutes 5 || status=$?
          # aggregates only, no post text: readable here without downloading the artifact
          cat reports/live_run.json || true
          exit $status

      # The sample does not depend on the report's count check, so it is drawn
      # whenever MongoDB holds the whole run.
      - name: Sample for labeling
        if: ${{ !cancelled() && steps.written.outcome == 'success' }}
        env:
          LABEL_SAMPLE_PASSPHRASE: ${{ secrets.LABEL_SAMPLE_PASSPHRASE }}
        run: |
          plain="$RUNNER_TEMP/label-sample-plain/label_sample.csv"
          python -m scripts.sample_for_labeling --n 200 --seed 42 --output "$plain"
          mkdir -p "$RUNNER_TEMP/label-sample"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:LABEL_SAMPLE_PASSPHRASE \
            -in "$plain" -out "$RUNNER_TEMP/label-sample/label_sample.csv.enc"
          rm -rf "$RUNNER_TEMP/label-sample-plain"

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: |
            reports/live_run.json
            reports/live_snapshot/
          if-no-files-found: warn
          retention-days: 30

      # Post text (handles masked), encrypted; kept for 3 days only.
      - name: Upload the labeling sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-sample
          path: ${{ runner.temp }}/label-sample/label_sample.csv.enc
          if-no-files-found: warn
          retention-days: 3

      - name: Show the containers on failure
        if: failure()
        run: docker compose --profile live ps -a

      - name: Stop and remove everything
        if: always()
        run: docker compose --profile live down -v
